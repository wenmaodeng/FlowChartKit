.umls-name-i { font: italic 500 13px var(--font-sans); fill: var(--text); }
.umls-field { font: 400 11px var(--font-mono); fill: var(--text); }
.umls-box { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.umls-box-brand { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.5; }
.umls-box-ext { fill: var(--surface-muted); stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; }
.umls-boundary { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 5 4; }
.umls-div { stroke: var(--border); stroke-width: 1; }
.umls-arr { stroke: var(--text-muted); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.umls-arr-brand { stroke: var(--brand-text); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.umls-arr-dash { stroke: var(--text-muted); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
.umls-label { font: 400 10px var(--font-sans); fill: var(--text-muted); }
.umls-cap-bg { fill: var(--surface); stroke: var(--border); stroke-width: 0.6; }
.umls-legend { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; gap: 16px; flex-wrap: wrap; font: 400 11px var(--font-sans); color: var(--text-muted); align-items: center; }
.umls-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.umls-mark { display: inline-block; }
</style>
<div class="umls" data-dynamic-ui-widget data-template="fck-uml" data-mounted="true">
  <div class="umls-card">
    <div class="umls-title">FlowChartKit — ViewModel 类关系图</div>
    <div class="umls-sub">L3 核心层 · 继承 / 组合 / 关联 / 依赖（UML 简化表示）</div>
    <svg viewBox="0 0 720 480" width="100%" height="auto" role="img" aria-label="FlowChartKit ViewModel class relationships">
      <defs>
        <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M1,1 L11,6 L1,11 Z" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1.2"/>
        </marker>
        <marker id="diamond" viewBox="0 0 16 8" refX="2" refY="4" markerWidth="12" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M2,4 L8,0 L14,4 L8,8 Z" fill="var(--text-muted)" stroke="var(--text-muted)" stroke-width="1"/>
        </marker>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--text-muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ViewModels namespace boundary -->
      <rect class="umls-boundary" x="40" y="100" width="640" height="260" rx="8" ry="8"/>
      <text class="umls-cap" x="52" y="118" font-style="italic">namespace FlowChartKit.ViewModels</text>

      <!-- ObservableBase (parent, abstract) -->
      <rect class="umls-box" x="280" y="20" width="160" height="52" rx="6" ry="6"/>
      <text class="umls-cap" x="360" y="36" text-anchor="middle" font-style="italic">«abstract»</text>
      <text class="umls-name-i" x="360" y="52" text-anchor="middle">ObservableBase</text>
      <line class="umls-div" x1="280" y1="60" x2="440" y2="60"/>
      <text class="umls-field" x="360" y="72" text-anchor="middle">INotifyPropertyChanged</text>

      <!-- DiagramViewModel (BRAND focal, central owner) -->
      <rect class="umls-box-brand" x="200" y="120" width="320" height="88" rx="6" ry="6"/>
      <text class="umls-name" x="360" y="138" text-anchor="middle">DiagramViewModel</text>
      <line class="umls-div" x1="200" y1="146" x2="520" y2="146"/>
      <text class="umls-field" x="212" y="162">Nodes : List&lt;NodeViewModel&gt;</text>
      <text class="umls-field" x="212" y="178">Connections : List&lt;ConnViewModel&gt;</text>
      <line class="umls-div" x1="200" y1="186" x2="520" y2="186"/>
      <text class="umls-field" x="212" y="202">AddNode() / AddConnection() / ToData()</text>

      <!-- NodeViewModel -->
      <rect class="umls-box" x="85" y="250" width="170" height="72" rx="6" ry="6"/>
      <text class="umls-name" x="170" y="268" text-anchor="middle">NodeViewModel</text>
      <line class="umls-div" x1="85" y1="276" x2="255" y2="276"/>
      <text class="umls-field" x="95" y="292">Kind / Id / X / Y</text>
      <text class="umls-field" x="95" y="308">Ports : List&lt;Port&gt;</text>

      <!-- PortViewModel -->
      <rect class="umls-box" x="275" y="250" width="170" height="72" rx="6" ry="6"/>
      <text class="umls-name" x="360" y="268" text-anchor="middle">PortViewModel</text>
      <line class="umls-div" x1="275" y1="276" x2="445" y2="276"/>
      <text class="umls-field" x="285" y="292">Owner / FX / FY / Dir</text>
      <text class="umls-field" x="285" y="308">AbsolutePoint</text>

      <!-- ConnectionViewModel -->
      <rect class="umls-box" x="465" y="250" width="170" height="80" rx="6" ry="6"/>
      <text class="umls-name" x="550" y="268" text-anchor="middle">ConnectionViewModel</text>
      <line class="umls-div" x1="465" y1="276" x2="635" y2="276"/>
      <text class="umls-field" x="475" y="292">Source/Target Node+Port</text>
      <text class="umls-field" x="475" y="308">Direction / Points</text>
      <text class="umls-field" x="475" y="324">Recompute()</text>

      <!-- DiagramData (external, L2) -->
      <rect class="umls-box-ext" x="85" y="400" width="170" height="48" rx="6" ry="6"/>
      <text class="umls-name" x="170" y="418" text-anchor="middle">DiagramData</text>
      <line class="umls-div" x1="85" y1="426" x2="255" y2="426"/>
      <text class="umls-field" x="170" y="442" text-anchor="middle">Nodes / Connections</text>

      <!-- OrthogonalRouter (external, L4) -->
      <rect class="umls-box-ext" x="465" y="400" width="170" height="48" rx="6" ry="6"/>
      <text class="umls-name" x="550" y="418" text-anchor="middle">OrthogonalRouter</text>
      <line class="umls-div" x1="465" y1="426" x2="635" y2="426"/>
      <text class="umls-field" x="550" y="442" text-anchor="middle">Route() / AutoDir()</text>

      <!-- ===== Connectors ===== -->

      <!-- 1. Inheritance: boundary → ObservableBase (open triangle at parent) -->
      <path class="umls-arr" d="M 360 100 L 360 74" marker-end="url(#inherit)"/>
      <text class="umls-label" x="368" y="92">△ 4 VMs inherit</text>

      <!-- 2. Composition DiagramVM ◇—▶ NodeVM -->
      <path class="umls-arr" d="M 240 208 L 170 250" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
      <text class="umls-label" x="196" y="226">1..*</text>

      <!-- 3. Composition DiagramVM ◇—▶ ConnectionVM -->
      <path class="umls-arr" d="M 480 208 L 550 250" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
      <text class="umls-label" x="510" y="226">1..*</text>

      <!-- 4. Composition NodeVM ◇—▶ PortVM -->
      <path class="umls-arr" d="M 255 286 L 275 286" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
      <text class="umls-label" x="258" y="280">1..*</text>

      <!-- 5. Association ConnectionVM —▶ NodeVM (Source/Target) routed under row -->
      <path class="umls-arr" d="M 505 330 L 505 348 L 170 348 L 170 322" marker-end="url(#arrow)"/>
      <rect class="umls-cap-bg" x="298" y="338" width="84" height="14" rx="7" ry="7"/>
      <text class="umls-label" x="340" y="349" text-anchor="middle">Source/Target</text>

      <!-- 6. Association ConnectionVM —▶ PortVM (Source/Target) routed under row -->
      <path class="umls-arr" d="M 485 330 L 485 362 L 360 362 L 360 322" marker-end="url(#arrow)"/>
      <rect class="umls-cap-bg" x="392" y="352" width="84" height="14" rx="7" ry="7"/>
      <text class="umls-label" x="434" y="363" text-anchor="middle">Source/Target</text>

      <!-- 7. Dependency ConnectionVM ⇢ OrthogonalRouter (uses, dashed) -->
      <path class="umls-arr-dash" d="M 550 330 L 550 400" marker-end="url(#arrow)"/>
      <text class="umls-label" x="558" y="368">uses</text>

      <!-- 8. Dependency DiagramVM ⇢ DiagramData (serialize, dashed, routed left) -->
      <path class="umls-arr-dash" d="M 200 208 L 52 208 L 52 424 L 85 424" marker-end="url(#arrow)"/>
      <text class="umls-label" x="120" y="201" text-anchor="middle">serialize / load</text>
    </svg>
    <div class="umls-legend">
      <div class="umls-legend-item"><svg width="22" height="10"><path d="M2 5 L8 0 L14 5 L8 10 Z" fill="var(--text-muted)"/><line x1="14" y1="5" x2="22" y2="5" stroke="var(--text-muted)" stroke-width="1.4"/></svg> 组合（owns 1..*）</div>
      <div class="umls-legend-item"><svg width="22" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--text-muted)" stroke-width="1.4"/><path d="M14 1 L22 5 L14 9" fill="none" stroke="var(--text-muted)" stroke-width="1.4"/></svg> 关联（references）</div>
      <div class="umls-legend-item"><svg width="22" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M14 1 L22 5 L14 9" fill="none" stroke="var(--text-muted)" stroke-width="1.4"/></svg> 依赖（uses）</div>
      <div class="umls-legend-item"><svg width="22" height="12"><path d="M2 1 L12 6 L2 11 Z" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1"/></svg> 继承（△ inherits）</div>
    </div>
  </div>
</div>
</div>
