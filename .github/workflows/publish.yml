name: publish

# 发版流程：更新 csproj 的 Version → 提交 → git tag v1.0.0 → git push --tags
# 自动完成：版本一致性校验 → Release 打包 → 推送 NuGet.org → 创建 GitHub Release 并附包
on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 GitHub Release 并上传附件
  id-token: write # Trusted Publishing：向 NuGet.org 换取短期 API Key 所需的 OIDC 令牌

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # tag（v1.2.3）必须与 csproj 的 <Version> 一致，防止包版本与发布标签错位
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $csproj = "FlowChartKit/FlowChartKit.csproj"
          $version = (Select-String -Path $csproj -Pattern '<Version>(.*?)</Version>').Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "tag v$tag 与 csproj Version $version 不一致：更新 FlowChartKit/FlowChartKit.csproj 的 <Version> 后重新打 tag"
          }

      - name: Pack
        run: dotnet pack FlowChartKit/FlowChartKit.csproj -c Release -o artifacts

      # Trusted Publishing：内置凭据提供商不会自动做 OIDC 交换（实测 401），
      # 需手动向 GitHub OIDC 申请令牌换取 NuGet 短期 API Key
      # 注意：windows runner 的 pwsh 不展开通配符，须先枚举 nupkg 再推送
      # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN 由 runner 在 id-token: write 下自动注入步骤环境
      - name: Push to NuGet.org (Trusted Publishing)
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object { $_.FullName }
          if (-not $pkgs) { Write-Error "artifacts 下未找到 nupkg，Pack 步骤输出异常" }
          # 1) 申请 audience=api://NuGet.org 的 OIDC 令牌
          $requestUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://NuGet.org"
          $oidcToken = (Invoke-RestMethod -Uri $requestUrl -Headers @{Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}).value
          # 2) 换取 NuGet 短期 API Key
          $body = @{
            grant_type         = "urn:ietf:params:oauth:grant-type:token-exchange"
            subject_token_type = "urn:ietf:params:oauth:token-type:jwt"
            subject_token      = $oidcToken
            audience           = "api://NuGet.org"
          } | ConvertTo-Json
          $apiKey = (Invoke-RestMethod -Uri "https://api.nuget.org/v3/oidc/request-token" -Method Post -ContentType "application/json" -Body $body).access_token
          # 3) 推送
          dotnet nuget push $pkgs --source https://api.nuget.org/v3/index.json --api-key $apiKey --skip-duplicate

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkgs = Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $pkgs --title $env:GITHUB_REF_NAME --notes-file CHANGELOG.md
